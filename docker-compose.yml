#
# The server binds to loopback only; a reverse proxy terminates TLS and forwards
# to 127.0.0.1:9095. Secrets come from `.env` (see deploy/.env.example).

services:
  daywerk:
    image: daywerk:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Reachable from the reverse proxy on the LAN; the host firewall limits
      # who may connect.
      - "9095:9095"
    volumes:
      - ./data:/app/data
    environment:
      DB_PATH: "/app/data/daywerk.db"
      WEB_ROOT: "/app/web"
      PORT: "9095"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
    restart: unless-stopped
